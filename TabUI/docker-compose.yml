services:
  tabui:
    build:
      context: .
    image: kuglass-tabui:local
    restart: unless-stopped
    ports:
      - "${TABUI_HTTP_PORT:-8080}:8080"
    environment:
      # Docker is retained only for an explicit hardware-free MOCK session.
      TABUI_TRANSPORT: mock
      TABUI_HIL_ENABLED: "${TABUI_HIL_ENABLED:-0}"
    volumes:
      - tabui-data:/data

volumes:
  tabui-data:
