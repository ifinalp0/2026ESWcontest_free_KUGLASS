services:
  tabui:
    build:
      context: .
    image: kuglass-tabui:local
    restart: unless-stopped
    ports:
      - "${TABUI_HTTP_PORT:-8080}:8080"
    environment:
      TABUI_TRANSPORT: "${TABUI_TRANSPORT:-mock}"
      TABUI_SERIAL_PORT: "${TABUI_SERIAL_PORT:-/dev/ttyUSB0}"
      TABUI_SERIAL_BAUD: "${TABUI_SERIAL_BAUD:-115200}"
      TABUI_HIL_ENABLED: "${TABUI_HIL_ENABLED:-0}"
    volumes:
      - tabui-data:/data

volumes:
  tabui-data:
