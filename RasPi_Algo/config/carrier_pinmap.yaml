controllers:
  A:
    channels: [0, 1, 2, 3]
    usb_alias: /dev/serial/by-id/kuglass-esp32-a
  B:
    channels: [4, 5, 6, 7]
    usb_alias: /dev/serial/by-id/kuglass-esp32-b

signals:
  per_channel:
    - PWM_MAG
    - DIR_POLARITY
    - EN_LOCAL
    - FAULT_N
    - ADC_V
    - ADC_I
    - ADC_TEMP
  global:
    - EN_GLOBAL
    - ESTOP_N
    - GND
    - LOGIC_5V
    - LOGIC_3V3

