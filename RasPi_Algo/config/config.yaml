runtime:
  mode: mock
  loop_hz: 20
  state_path: /tmp/kuglass_state.json
  command_queue_path: /tmp/kuglass_commands.jsonl
  log_dir: logs
  ttl_ms: 200

camera:
  source: mock
  front_index: 0
  rear_index: 1
  width: 320
  height: 180
  saturation_threshold: 245
  edge_threshold: 22

sensors:
  source: mock
  i2c_bus: 1
  tca9548a_address: 0x70
  veml7700_address: 0x10
  ds18b20_path: ""

weather:
  source: mock
  latitude: 37.5665
  longitude: 126.9780
  refresh_s: 180
  stale_s: 600

serial:
  enabled: false
  controller_a_port: /dev/serial/by-id/kuglass-esp32-a
  controller_b_port: /dev/serial/by-id/kuglass-esp32-b
  baudrate: 115200

policy:
  front_strong_threshold: 0.46
  hot_summer_temperature_c: 31.0
  thermal_lux_threshold: 9000.0
  driving_ch0_min_transmission: 0.62
  driving_ch1_min_transmission: 0.55

